<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2e4d"/><stop offset="1" stop-color="#5c3850"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.4"/></filter>
  </defs>
  <rect width="720" height="250" rx="16" fill="url(#bg)"/>

  <!-- keys -->
  <g font-size="15" font-weight="600" fill="#fff" text-anchor="middle">
    <rect x="40" y="38" width="64" height="44" rx="9" fill="#1d1d22" stroke="#ffffff33"/>
    <text x="72" y="66">⌘ cmd</text>
    <text x="126" y="66" font-size="20" fill="#ffffffaa">+</text>
    <rect x="148" y="38" width="120" height="44" rx="9" fill="#1d1d22" stroke="#ffffff33"/>
    <text x="208" y="66">space</text>
  </g>
  <text x="290" y="66" font-size="15" fill="#ffffffcc">opens Spotlight search</text>

  <!-- spotlight bar -->
  <g filter="url(#sh)">
    <rect x="40" y="110" width="640" height="104" rx="14" fill="#2b2b30" stroke="#ffffff22"/>
  </g>
  <circle cx="72" cy="140" r="8" fill="none" stroke="#ffffff99" stroke-width="2.2"/>
  <line x1="78" y1="146" x2="84" y2="152" stroke="#ffffff99" stroke-width="2.2" stroke-linecap="round"/>
  <text x="98" y="148" font-size="22" fill="#fff">Terminal</text>
  <rect x="190" y="128" width="2" height="26" fill="#4ea1ff"/>
  <line x1="40" y1="166" x2="680" y2="166" stroke="#ffffff14"/>
  <rect x="50" y="172" width="620" height="34" rx="8" fill="#0a64d8"/>
  <!-- generic terminal icon -->
  <rect x="60" y="177" width="24" height="24" rx="5" fill="#111" stroke="#ffffff55"/>
  <text x="65" y="194" font-size="11" font-family="Menlo, monospace" fill="#fff">&gt;_</text>
  <text x="96" y="195" font-size="15" fill="#fff">Terminal</text>
  <text x="660" y="195" font-size="13" fill="#ffffffcc" text-anchor="end">press return ⏎</text>
</svg>
