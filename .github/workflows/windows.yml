# Smoke test for the Windows build: runs the real installer on a Windows VM, checks the
# widget is still alive after a few seconds, and screenshots it with demo data.
name: windows
on:
  push:
    paths: ['install.ps1', 'windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:
jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install, check it stays up, screenshot
        shell: powershell
        run: |
          $env:HEADROOM_SRC = "$pwd\windows\Headroom.cs"
          $env:HEADROOM_DEMO = "$pwd\windows\demo"
          .\install.ps1
          if (-not (Test-Path "$env:LOCALAPPDATA\Headroom\Headroom.exe")) { throw 'exe not built' }
          if (-not (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run').Headroom) { throw 'no startup entry' }
          Start-Sleep 8
          if (-not (Get-Process Headroom -ErrorAction SilentlyContinue)) { throw 'Headroom exited' }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$pwd\screen.png")
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: screenshot, path: screen.png }
